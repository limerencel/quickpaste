<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUICKPASTE — ULTRA-FAST CLIPBOARD</title>
  <meta name="description" content="QUICKPASTE - ULTRA-FAST CROSS-DEVICE SYNC CLIPBOARD." />
  
  <!-- Preconnect and Import Serif Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-logo">
        <div class="logo-icon">📋</div>
        <span>QUICKPASTE</span>
      </div>
      <div class="header-right">
        <div id="status-dot" class="status-dot" title="CONNECTION STATUS"></div>
        <span id="username-label" class="username-label"></span>
        <button id="logout-btn" class="btn btn-ghost" title="LOGOUT SYSTEM">LOGOUT</button>
      </div>
    </header>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-box">
        <textarea
          id="clip-input"
          class="clip-textarea"
          placeholder="PASTE URL, TEXT, OR CODE HERE... (CTRL+ENTER TO SEND)"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <div class="input-actions">
          <span class="input-hint">PRESS CTRL+ENTER TO SEND</span>
          <button id="send-btn" class="btn-send">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            SEND
          </button>
        </div>
      </div>
    </div>

    <!-- Clips List -->
    <div class="clips-header">
      <span class="clips-title">CLIPBOARD INDEX</span>
      <span id="clips-count" class="clips-count hidden"></span>
    </div>

    <div id="clips-list" class="clips-list">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
