<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickPaste — 极速跨设备剪贴板</title>
  <meta name="description" content="你的极速跨设备剪贴板。随时随地同步文本和链接。" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-logo">
        <div class="logo-icon">📋</div>
        <span>QuickPaste</span>
      </div>
      <div class="header-right">
        <div id="status-dot" class="status-dot" title="连接状态"></div>
        <span id="username-label" class="username-label"></span>
        <button id="logout-btn" class="btn btn-ghost" title="退出登录">退出</button>
      </div>
    </header>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-box">
        <textarea
          id="clip-input"
          class="clip-textarea"
          placeholder="粘贴链接、文字、任何内容…  (Ctrl+Enter 发送)"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <div class="input-actions">
          <span class="input-hint">Ctrl+Enter 快速发送</span>
          <button id="send-btn" class="btn-send">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            发送
          </button>
        </div>
      </div>
    </div>

    <!-- Clips List -->
    <div class="clips-header">
      <span class="clips-title">剪贴板</span>
      <span id="clips-count" class="clips-count hidden"></span>
    </div>

    <div id="clips-list" class="clips-list">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
