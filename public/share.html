<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分享内容 — QuickPaste</title>
  <meta name="description" content="通过 QuickPaste 分享的内容" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
</head>
<body>
  <div class="share-page">
    <div class="share-card">
      <div class="share-card-header">
        <div class="logo-icon">📋</div>
        <div>
          <div class="share-card-title">共享内容</div>
          <div class="share-card-subtitle" id="share-time"></div>
        </div>
      </div>

      <div class="share-content-box">
        <div id="share-content" class="share-content">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <div class="share-actions">
        <button id="copy-btn" class="btn btn-primary" style="flex:1; max-width: 160px;">
          复制内容
        </button>
        <div id="copy-feedback" style="font-size:0.85rem; color: var(--green); display:none;">✓ 已复制</div>
      </div>
    </div>

    <p class="share-brand">
      由 <a href="/">QuickPaste</a> 驱动 · <a href="/login.html">创建自己的剪贴板</a>
    </p>
  </div>

  <script>
    // Extract shareId from URL: /s/:shareId
    const shareId = location.pathname.split('/').pop();
    const contentEl = document.getElementById('share-content');
    const timeEl = document.getElementById('share-time');
    const copyBtn = document.getElementById('copy-btn');
    const copyFeedback = document.getElementById('copy-feedback');

    let clipContent = '';

    function linkify(text) {
      const urlReg = /(https?:\/\/[^\s<>"{}|\\^`\[\]]+)/g;
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(urlReg, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
    }

    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleString('zh-CN', { dateStyle: 'medium', timeStyle: 'short' });
      } catch { return ''; }
    }

    async function loadShare() {
      try {
        const res = await fetch(`/api/share/view/${shareId}`);
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          contentEl.innerHTML = `<span style="color:var(--text-muted)">${data.error || '内容不存在或已被删除'}</span>`;
          copyBtn.disabled = true;
          return;
        }
        const data = await res.json();
        clipContent = data.content;
        contentEl.innerHTML = linkify(data.content);
        timeEl.textContent = formatTime(data.created_at);
      } catch {
        contentEl.innerHTML = `<span style="color:var(--text-muted)">加载失败，请刷新重试</span>`;
      }
    }

    copyBtn.addEventListener('click', async () => {
      if (!clipContent) return;
      try {
        await navigator.clipboard.writeText(clipContent);
        copyBtn.textContent = '✓ 已复制';
        copyBtn.style.background = 'var(--green)';
        copyFeedback.style.display = 'none';
        setTimeout(() => {
          copyBtn.textContent = '复制内容';
          copyBtn.style.background = '';
        }, 2000);
      } catch {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = clipContent;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    });

    loadShare();
  </script>
</body>
</html>
