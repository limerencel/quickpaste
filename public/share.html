<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHARED CLIP — QUICKPASTE</title>
  <meta name="description" content="SHARED CLIP FROM QUICKPASTE." />
  
  <!-- Preconnect and Import Serif Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
</head>
<body>
  <div class="share-page">
    <div class="share-card">
      <div class="share-card-header">
        <div class="logo-icon">📋</div>
        <div>
          <div class="share-card-title">SHARED CONTENT</div>
          <div class="share-card-subtitle" id="share-time"></div>
        </div>
      </div>

      <div class="share-content-box">
        <div id="share-content" class="share-content">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <div class="share-actions">
        <button id="copy-btn" class="btn btn-primary" style="flex: 1; max-width: 180px;">
          COPY CONTENT
        </button>
        <div id="copy-feedback" style="font-size: 0.85rem; color: var(--green); display: none;">COPIED</div>
      </div>
    </div>

    <p class="share-brand">
      POWERED BY <a href="/">QUICKPASTE</a> · <a href="/login.html">CREATE YOUR OWN CLIPBOARD</a>
    </p>
  </div>

  <script>
    // Extract shareId from URL: /s/:shareId
    const shareId = location.pathname.split('/').pop();
    const contentEl = document.getElementById('share-content');
    const timeEl = document.getElementById('share-time');
    const copyBtn = document.getElementById('copy-btn');
    const copyFeedback = document.getElementById('copy-feedback');

    let clipContent = '';

    function linkify(text) {
      const urlReg = /(https?:\/\/[^\s<>"{}|\\^`\[\]]+)/g;
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(urlReg, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
    }

    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleString('en-US', { 
          month: 'short', 
          day: 'numeric', 
          hour: '2-digit', 
          minute: '2-digit', 
          hour12: false 
        }).toUpperCase();
      } catch { return ''; }
    }

    async function loadShare() {
      try {
        const res = await fetch(`/api/share/view/${shareId}`);
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          contentEl.innerHTML = `<span style="color:var(--text-muted)">${data.error ? data.error.toUpperCase() : 'CONTENT NOT FOUND OR HAS BEEN DELETED'}</span>`;
          copyBtn.disabled = true;
          return;
        }
        const data = await res.json();
        clipContent = data.content;
        contentEl.innerHTML = linkify(data.content);
        timeEl.textContent = formatTime(data.created_at);
      } catch {
        contentEl.innerHTML = `<span style="color:var(--text-muted)">FAILED TO LOAD. PLEASE REFRESH AND TRY AGAIN.</span>`;
      }
    }

    copyBtn.addEventListener('click', async () => {
      if (!clipContent) return;
      try {
        await navigator.clipboard.writeText(clipContent);
        copyBtn.textContent = 'COPIED';
        copyBtn.style.background = 'var(--green-bg)';
        copyBtn.style.color = 'var(--green)';
        copyBtn.style.borderColor = 'var(--green)';
        copyFeedback.style.display = 'none';
        setTimeout(() => {
          copyBtn.textContent = 'COPY CONTENT';
          copyBtn.style.background = '';
          copyBtn.style.color = '';
          copyBtn.style.borderColor = '';
        }, 2000);
      } catch {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = clipContent;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    });

    loadShare();
  </script>
</body>
</html>
